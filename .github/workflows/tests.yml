name: Tests

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  release:
    types: [ published ]
  schedule:
    - cron: '0 6 * * *'   # nightly real-API run (consumes Groq credits)

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        php-version: ['8.2', '8.3', '8.4']

    steps:
    - uses: actions/checkout@v4

    - name: Setup PHP
      uses: shivammathur/setup-php@v2
      with:
        php-version: ${{ matrix.php-version }}
        extensions: fileinfo, json

    - name: Validate composer.json
      run: composer validate --strict

    - name: Cache Composer packages
      id: composer-cache
      uses: actions/cache@v4
      with:
        path: vendor
        key: ${{ runner.os }}-php-${{ hashFiles('**/composer.lock') }}
        restore-keys: |
          ${{ runner.os }}-php-

    - name: Install dependencies
      run: composer install --prefer-dist --no-progress

    # Mock suite: no network, no API key, no credits consumed.
    - name: Run mock test suite
      run: composer test

    # Live suite: only on the nightly schedule, using the repository secret.
    - name: Run live test suite (real API)
      if: github.event_name == 'schedule'
      env:
        GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
        GROQ_LIVE_TESTS: '1'
      run: composer test
